<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CHDP-DIFF Static Demo</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>CHDP-DIFF Demo</h1>
        <span>Precomputed local Python outputs for before-and-after image difference recognition</span>
      </div>
      <span class="mode-pill">Static GitHub Pages</span>
    </header>

    <main>
      <section class="top-row">
        <div class="result-card">
          <div class="result-copy">
            <p class="eyebrow">Precomputed result</p>
            <h2 id="resultTitle">Select a sample pair</h2>
            <p id="resultMeta">Local Python pipeline output.</p>
            <div class="metrics">
              <div><span id="confidence">--</span><small>confidence</small></div>
              <div><span id="boxCount">--</span><small>boxes</small></div>
            </div>
          </div>
          <div class="result-image">
            <img id="resultImage" alt="Precomputed detection result" />
          </div>
        </div>

        <div class="process-card">
          <figure>
            <figcaption>Registration pipeline</figcaption>
            <img src="assets/reference/registration.png" alt="Registration pipeline" />
          </figure>
          <figure>
            <figcaption>Difference pipeline</figcaption>
            <img src="assets/reference/difference.png" alt="Difference pipeline" />
          </figure>
        </div>
      </section>

      <section class="pipeline-row">
        <div class="section-title">
          <p class="eyebrow">Pipeline output</p>
        </div>
        <div class="output-grid">
          <figure class="heatmap-frame">
            <figcaption>Heatmap</figcaption>
            <img id="heatmapImage" alt="Difference heatmap" />
          </figure>
          <figure class="panel-frame">
            <figcaption>Full panel</figcaption>
            <img id="panelImage" alt="Full pipeline panel" />
          </figure>
        </div>
      </section>

      <section class="dataset-section">
        <div id="sampleGrid" class="sample-grid"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
