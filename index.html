<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CHDP-DIFF Static Demo</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>CHDP-DIFF Demo</h1>
        <span>Precomputed RegionSIFT + SSIM results from the local Python pipeline</span>
      </div>
      <span class="mode-pill">Static GitHub Pages</span>
    </header>

    <main>
      <section class="result-band">
        <div class="result-copy">
          <div>
            <p class="eyebrow">Precomputed result</p>
            <h2 id="resultTitle">Select a sample pair</h2>
            <p id="resultMeta">Local Python pipeline output appears here.</p>
          </div>
          <div class="metrics">
            <div><span id="confidence">--</span><small>confidence</small></div>
            <div><span id="boxCount">--</span><small>boxes</small></div>
          </div>
        </div>
        <div class="result-image">
          <img id="resultImage" alt="Precomputed detection result" />
        </div>
      </section>

      <p id="notice" class="notice"></p>

      <section class="workspace">
        <div class="visual-panel">
          <div class="section-title">
            <p class="eyebrow">Pipeline output</p>
          </div>
          <div class="tabs">
            <button class="tab active" data-visual="heatmap">Heatmap</button>
            <button class="tab" data-visual="panel">Full panel</button>
          </div>
          <div class="visual-frame">
            <img id="heatmapImage" class="visual-img active" alt="Difference heatmap" src="assets/reference/heatmap_reference.png" />
            <img id="panelImage" class="visual-img" alt="Full pipeline panel" src="" />
          </div>
        </div>
        <aside class="flow-panel">
          <div class="section-title">
            <p class="eyebrow">Current pair views</p>
          </div>
          <div class="pair-views">
            <figure>
              <figcaption>Difference</figcaption>
              <img id="differenceImage" alt="Difference image for selected pair" />
            </figure>
            <figure>
              <figcaption>Registration</figcaption>
              <img id="registrationImage" alt="Registration overlay for selected pair" />
            </figure>
          </div>
        </aside>
      </section>

      <section class="dataset-section">
        <div class="dataset-head">
          <div class="section-title">
            <p class="eyebrow">Dataset pairs</p>
          </div>
          <div id="status" class="status">Loading samples...</div>
        </div>
        <div id="sampleGrid" class="sample-grid"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
